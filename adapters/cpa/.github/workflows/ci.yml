name: Offline tests and development artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - name: Unit tests, race, vet and fuzz
        run: |
          test -z "$(gofmt -l *.go)"
          go test ./... -count=1
          go test ./... -race -count=1
          go vet ./...
          go test -run '^$' -fuzz '^FuzzDecoderChunkBoundaries$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzRestoreCollaborationToolSchemas$' -fuzztime=15s -parallel=2
      - name: Native mock-host tests (no model calls)
        run: |
          mkdir -p build
          go build -trimpath -buildmode=c-shared -ldflags '-X main.pluginVersion=0.1.0-dev.5' -o build/codexreflow.so .
          python3 scripts/native_smoke.py build/codexreflow.so --report build/native-smoke.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare checksum-verified project-local tools
        run: python scripts/bootstrap_windows_tools.py
      - name: Unit tests, race and vet
        shell: pwsh
        run: |
          . ./scripts/dev_env.ps1
          $Sources = @(Get-ChildItem -File -Filter '*.go' | ForEach-Object FullName)
          $Unformatted = gofmt -l $Sources
          if ($LASTEXITCODE -ne 0 -or $Unformatted) { throw 'Go source is not formatted.' }
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          go test ./... -race -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Race tests failed.' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Vet failed.' }
      - name: Build and exercise development DLL
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1
          python scripts/native_smoke.py build/codexreflow.dll --report build/native-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed.' }
          python -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Release validation tests failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codexreflow-windows-amd64-development
          path: |
            build/codexreflow.dll
            build/native-smoke.json
            LICENSE
            THIRD_PARTY_NOTICES.md
            THIRD_PARTY_LICENSES.txt
