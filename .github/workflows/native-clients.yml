name: Native client fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The manually approved Linux host control shares this queue.
  group: native-client-execution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-clients:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - name: Install pinned clients without lifecycle scripts
        run: |
          New-Item -ItemType Directory -Force .tools/native-clients | Out-Null
          Copy-Item ci/native-clients/package*.json .tools/native-clients/
          npm ci --prefix .tools/native-clients --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test extracted native packages with synthetic login
        run: python scripts/check-native-clients.py
      - name: Preserve numeric summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-client-summary-${{ matrix.os }}
          path: build/native-client-ci/*/summary.json
          if-no-files-found: warn
          retention-days: 30
